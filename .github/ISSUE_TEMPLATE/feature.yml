name: Feature request
description: Propose a focused capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Describe the workflow or limitation. }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [build-engine, blueprint, world-api, performance, security, documentation, other]
    validations: { required: true }
